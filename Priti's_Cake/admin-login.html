<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Priti's Cake</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-badge {
      display: inline-block;
      background: #e91e8c;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <a href="index.html" class="logo">Priti's <span>Cake</span> 🎂</a>
      <div><span class="admin-badge">Secure Admin Portal</span></div>
    </div>

    <!-- ADMIN LOGIN FORM -->
    <div class="auth-form active" id="loginForm">
      <h2 style="margin-top: 15px;">Admin Access 🔒</h2>
      <p>Authorized personnel only</p>
      <div class="form-group" style="margin-top:20px">
        <label>Admin Email</label>
        <input type="email" id="loginEmail" placeholder="admin@priticake.local">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter admin password">
      </div>
      <button class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;margin-top:10px" onclick="handleAdminLogin()">Secure Login →</button>
    </div>

    <div style="text-align:center;margin-top:20px">
      <a href="login.html" style="color:#666;font-size:0.85rem;text-decoration:none">← Back to Customer Login</a>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // If already logged in as admin, redirect to admin dashboard
    if (isAdmin()) window.location.href = 'admin-dashboard.html';
  });

  async function handleAdminLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showToast('Please fill all fields', 'error'); return; }

    try {
      const res = await api.post('/auth/login', { email, password });
      
      if (res.user && res.user.role === 'admin') {
        localStorage.setItem('pc_token', res.token);
        localStorage.setItem('pc_admin', JSON.stringify(res.user));
        showToast('Admin login successful! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 1000);
      } else {
        showToast('Admin access required.', 'error');
      }
    } catch (err) {
      showToast('Invalid email or password', 'error');
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      handleAdminLogin();
    }
  });
</script>
</body>
</html>
