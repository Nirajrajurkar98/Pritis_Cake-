<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Priti's Cake</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <a href="index.html" class="logo">Priti's <span>Cake</span> 🎂</a>
      <p style="color:#666;font-size:0.85rem;margin-top:8px">Welcome back! Please login to continue</p>
    </div>

    <!-- LOGIN FORM -->
    <div class="auth-form active" id="loginForm">
      <h2>Welcome Back! 👋</h2>
      <p>Login to your account to order cakes</p>
      <div class="form-group" style="margin-top:20px">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <div class="forgot-link"><a href="#">Forgot Password?</a></div>
      <button class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem" onclick="handleLogin()">Login →</button>
      <div class="auth-divider">or</div>
      <div style="text-align:center;margin-top:15px">
        New here? <a href="register.html" style="color:#e91e8c;font-weight:600;text-decoration:none">Create an Account</a>
      </div>
      <div style="text-align:center;margin-top:15px">
        <a href="admin-login.html" style="color:#e91e8c;font-size:0.9rem;font-weight:600;text-decoration:none">🛡️ Admin Portal Login</a>
      </div>
    </div>

    <div style="text-align:center;margin-top:20px">
      <a href="index.html" style="color:#e91e8c;font-size:0.85rem;text-decoration:none">← Back to Home</a>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (window.initPromise) await window.initPromise;

    const params = new URLSearchParams(window.location.search);

    // Registration flow: register.html -> POST /api/auth/register -> login.html
    if (params.get('tab') === 'register') {
      window.location.href = 'register.html';
      return;
    }
    if (params.get('registered') === '1') {
      showToast('Account created successfully! Please login. 🎉', 'success');
      history.replaceState(null, '', 'login.html');
    }

    // Redirect if already authenticated (admin -> admin dashboard, customer -> dashboard)
    const isAuth = isLoggedIn();
    const admin = isAdmin();
    if (isAuth) {
      window.location.href = admin ? 'admin-dashboard.html' : 'client-dashboard.html';
    }
  });

  function showLoginError(msg) {
    if (msg) showToast(msg, 'error');
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) { showLoginError('Please fill all fields'); return; }
    if (!isValidEmail(email)) { showLoginError('Please enter a valid email address'); return; }

    const btn = document.querySelector('#loginForm .btn-primary');
    btn.disabled = true;
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Logging in...';

    const result = await login(email, password);

    if (result.success) {
      showToast('Login successful! Redirecting...', 'success');
      setTimeout(() => {
        if (result.role === 'admin') {
          window.location.href = 'admin-dashboard.html';
        } else {
          window.location.href = 'client-dashboard.html';
        }
      }, 1000);
    } else {
      showLoginError(result.msg);
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
