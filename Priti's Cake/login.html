<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Priti's Cake</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <a href="index.html" class="logo">Priti's <span>Cake</span> 🎂</a>
      <p style="color:#666;font-size:0.85rem;margin-top:8px">Welcome back! Please login to continue</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="loginTab" onclick="switchTab('login')">Login</div>
      <div class="auth-tab" id="registerTab" onclick="switchTab('register')">Register</div>
    </div>

    <!-- LOGIN FORM -->
    <div class="auth-form active" id="loginForm">
      <h2>Welcome Back! 👋</h2>
      <p>Login to your account to order cakes</p>
      <div class="form-group" style="margin-top:20px">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password">
      </div>
      <div class="forgot-link"><a href="#">Forgot Password?</a></div>
      <button class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem" onclick="handleLogin()">Login →</button>
      <div class="auth-divider">or</div>
      <div style="text-align:center;font-size:0.85rem;color:#666">
        Admin login: <strong>admin@priticake.com</strong> / <strong>admin123</strong>
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div class="auth-form" id="registerForm">
      <h2>Create Account 🎂</h2>
      <p>Join us and order your favourite cakes!</p>
      <div class="form-group" style="margin-top:20px">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="regPhone" placeholder="+91 98765 43210">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Create a password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="regConfirm" placeholder="Confirm your password">
      </div>
      <button class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem" onclick="handleRegister()">Create Account →</button>
    </div>

    <div style="text-align:center;margin-top:20px">
      <a href="index.html" style="color:#e91e8c;font-size:0.85rem;text-decoration:none">← Back to Home</a>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/main.js"></script>
<script>
  // Redirect if already logged in
  document.addEventListener('DOMContentLoaded', () => {
    if (isAdmin()) window.location.href = 'admin-dashboard.html';
    else if (isLoggedIn()) window.location.href = 'client-dashboard.html';

    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'register') switchTab('register');
  });

  function switchTab(tab) {
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('registerTab').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('registerForm').classList.toggle('active', tab === 'register');
  }

  function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showToast('Please fill all fields', 'error'); return; }
    const result = login(email, password);
    if (result.success) {
      showToast('Login successful! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = result.role === 'admin' ? 'admin-dashboard.html' : 'client-dashboard.html';
      }, 1000);
    } else {
      showToast(result.msg, 'error');
    }
  }

  function handleRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    if (!name || !email || !password) { showToast('Please fill all required fields', 'error'); return; }
    if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }
    if (password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
    const result = register(name, email, phone, password);
    if (result.success) {
      showToast('Account created! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'client-dashboard.html', 1000);
    } else {
      showToast(result.msg, 'error');
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('loginForm').classList.contains('active')) handleLogin();
      else handleRegister();
    }
  });
</script>
</body>
</html>
